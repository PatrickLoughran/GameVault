name: Bug report
description: Report a reproducible problem in GameVault
title: "bug: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve GameVault.
        Please avoid sharing private or security-sensitive information.

  - type: input
    id: game
    attributes:
      label: Game name
      description: Which game has the problem?
      placeholder: e.g. Snake Game
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Mention your browser and device.
      placeholder: e.g. Chrome 155 on Windows 11
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Explain how to reproduce the problem.
      placeholder: |
        1. Open the game.
        2. Start playing.
        3. Observe the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What actually happened?
    validations:
      required: true